name: Build and Push Docker image

on:
  push:
    tags:
      - 'workflow_dispatch'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f Dockerfile-prod -t ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME} .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}

      - name: Build Docker Database hardrestore image
        run: docker build -f ./sql/Dockerfile-hardrestore-without-extensions -t ghcr.io/${{ github.repository }}/db-hardrestore:${GITHUB_REF_NAME} sql/

      - name: Push Docker Database hardrestore image
        run: docker push ghcr.io/${{ github.repository }}/db-hardrestore:${GITHUB_REF_NAME}